<text x="785.0" y="908" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#172033">Optional.empty() — ескерту жоқ</text>
<text x="660" y="1040" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#172033">Сенімді baseline автоматты жаңартылмайды. Қазіргі Main бұл сценарийді орындамайды.</text>
